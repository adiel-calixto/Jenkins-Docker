version: "3.8"

services:
  jenkins:
    build:
      context: .
      args:
        BASE_IMAGE_TAG: ${BASE_IMAGE_TAG:-latest-jdk21}
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
volumes:
  jenkins-home: {}
